name: Mercor alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Mercor and send Telegram alerts
        run: python mercor_bot.py --once
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Save which listings were already seen
        run: |
          git config user.name "mercor-bot"
          git config user.email "mercor-bot@users.noreply.github.com"
          if [ -f mercor_seen.json ]; then git add mercor_seen.json; fi
          git diff --cached --quiet || (git commit -m "update seen listings" && git push)
